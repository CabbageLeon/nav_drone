/tf_broadcaster_node:
  ros__parameters:
    # Sensor extrinsic calibration — position (m) + orientation (degrees)
    # base_link origin: drone center of mass, FLU frame (X=forward, Y=left, Z=up)
    # roll/pitch/yaw: degrees, 右手定则, ZYX 内旋顺序
    sensors:
      camera:
        x: 0.3
        y: 0.0
        z: -0.1
        roll: 0.0
        pitch: 0.0
        yaw: 0.0

      lidar:
        x: 0.0
        y: 0.0
        z: 0.1
        roll: 0.0
        pitch: 20.0    # 低头为正
        yaw: 0.0
