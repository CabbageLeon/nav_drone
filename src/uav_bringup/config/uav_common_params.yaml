# UAV Common Parameters — global defaults inherited by all nodes
# Individual node overrides go in their respective config/<node>_params.yaml

/**:
  ros__parameters:
    # Frame conventions
    odom_frame_id: "odom"
    base_link_frame_id: "base_link"
    map_frame_id: "map"

    # Coordinate frame: "enu" (ROS standard) or "ned" (PX4 native)
    # All internal modules use ENU; only px4_bridge converts at the boundary
    internal_frame: "enu"

    # Default operation
    auto_arm: false                 # arming requires explicit user confirmation
    auto_takeoff_height: -5.0       # NED meters (negative = up)

    # Safety limits
    max_altitude: 50.0              # meters (ENU)
    min_altitude: 0.5               # meters above ground
    geofence_radius: 100.0          # meters from origin

    # Launch-time node enable flags. Launch files read these values directly;
    # command line only selects the profile (sitl or real).
    launch_profiles:
      sitl:
        mavros: true
        realsense: false
        mission: true
        spf: true
        spf_image_test: true
        ugv_tcp: false
        delays:
          bridge_s: 5.0
          tf_s: 5.5
          controller_s: 6.0
          perception_s: 18.0
          mission_s: 20.0
      real:
        mavros: false
        realsense: true
        mission: true
        spf: true
        spf_image_test: false
        ugv_tcp: true
        delays:
          bridge_s: 0.0
          tf_s: 0.0
          controller_s: 0.0
          perception_s: 1.0
          mission_s: 2.0

    # RealSense wrapper launch arguments for the real-machine profile.
    # Current verified hardware exposes infra/depth streams, not RGB color.
    realsense:
      enable_color: false
      enable_depth: false
      enable_infra1: true
      enable_infra2: false
      initial_reset: true
